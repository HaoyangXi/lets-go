<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Let&#39;s Go</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one perforated ticket per trip, the stub carries a departure-board countdown; inside a trip, a day strip sits over a timeline */
:root{
  --paper:#EDF1F3; --card:#FFFFFF; --ink:#14202A; --ink-2:#485866; --ink-3:#7C8B96; --rule:#D3DCE1;
  --acc-sea:#1B5A86; --acc-sea-soft:#DCE9F2;
  --acc-teal:#0F6E6A; --acc-teal-soft:#D7EEEC;
  --acc-forest:#3A6B2E; --acc-forest-soft:#E0EDD9;
  --acc-plum:#7A3B78; --acc-plum-soft:#F0E1EF;
  --acc-coral:#B34A35; --acc-coral-soft:#F7E2DC;
  --acc-ink:#2E3A46; --acc-ink-soft:#E2E7EB;
  --on-acc:#FFFFFF;
  --sea:var(--acc-sea); --sea-soft:var(--acc-sea-soft);
  --amber:#E4A01B; --amber-soft:#FBEFD3; --on-amber:#231800;
  --done:#2B7956; --done-soft:#DCEFE4; --danger:#B03B2B; --danger-soft:#F6E1DC;
  --scrim:rgba(9,17,25,.46); --shadow:0 1px 2px rgba(20,32,42,.06),0 4px 14px rgba(20,32,42,.05);
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Impact,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E151B; --card:#16212A; --ink:#E5ECF0; --ink-2:#A8B6C0; --ink-3:#73828D; --rule:#26343E;
  --acc-sea:#7DB7DE; --acc-sea-soft:#17303F;
  --acc-teal:#5CC4BC; --acc-teal-soft:#123331;
  --acc-forest:#8CC47A; --acc-forest-soft:#1B2E17;
  --acc-plum:#D59AD2; --acc-plum-soft:#33203A;
  --acc-coral:#F0957F; --acc-coral-soft:#3B211B;
  --acc-ink:#B9C6D1; --acc-ink-soft:#24303A;
  --on-acc:#071219;
  --amber:#F1B63E; --amber-soft:#3A2D10; --on-amber:#1E1400;
  --done:#62C99B; --done-soft:#163126; --danger:#EE8B78; --danger-soft:#3B1F1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E151B; --card:#16212A; --ink:#E5ECF0; --ink-2:#A8B6C0; --ink-3:#73828D; --rule:#26343E;
  --acc-sea:#7DB7DE; --acc-sea-soft:#17303F;
  --acc-teal:#5CC4BC; --acc-teal-soft:#123331;
  --acc-forest:#8CC47A; --acc-forest-soft:#1B2E17;
  --acc-plum:#D59AD2; --acc-plum-soft:#33203A;
  --acc-coral:#F0957F; --acc-coral-soft:#3B211B;
  --acc-ink:#B9C6D1; --acc-ink-soft:#24303A;
  --on-acc:#071219;
  --amber:#F1B63E; --amber-soft:#3A2D10; --on-amber:#1E1400;
  --done:#62C99B; --done-soft:#163126; --danger:#EE8B78; --danger-soft:#3B1F1A;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
.c-sea{--tc:var(--acc-sea)}.c-teal{--tc:var(--acc-teal)}.c-forest{--tc:var(--acc-forest)}.c-plum{--tc:var(--acc-plum)}.c-coral{--tc:var(--acc-coral)}.c-ink{--tc:var(--acc-ink)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.center{padding-block:30vh 0;text-align:center;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-acc)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.linkish{color:var(--sea);font-weight:600;font-size:13px;text-decoration:none;padding:6px 2px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.chip.ex{background:var(--amber-soft);color:var(--ink)}
.chip.plain{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sea-soft);color:var(--sea);font:600 12px/1 var(--sans);text-transform:uppercase;flex:none}

/* login */
.login{max-width:420px;margin:0 auto;padding-block:10vh 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login h1{margin:0 0 8px;font:800 52px/0.92 var(--display);text-transform:uppercase}
.login .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-top:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* home */
.home{padding-block:24px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.me{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--card);border:1px solid var(--rule);font-size:14px;color:var(--ink-2);max-width:60%}
.me span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand h1{margin:0;font:800 44px/0.95 var(--display);letter-spacing:.01em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.lede{margin:0 0 20px;color:var(--ink-2)}
.notice{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.group{margin-top:26px}
.group h2{margin:0 0 10px;font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tickets{display:flex;flex-direction:column;gap:12px}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 112px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.t-main{display:flex;flex-direction:column;gap:3px;padding:16px 48px 16px 16px;min-width:0}
.t-name{font-weight:600;font-size:18px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.t-dest{color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.t-dates{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.t-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.t-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;border-left:2px dashed var(--rule);text-align:center;background:var(--tc,var(--sea));color:var(--on-acc)}
.t-stub::before,.t-stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.t-stub::before{top:-9px}.t-stub::after{bottom:-9px}
.t-stub .big{font:800 46px/0.9 var(--display);font-variant-numeric:tabular-nums}
.t-stub .unit{font:500 10.5px/1.25 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.st-now .t-stub{background:var(--amber);color:var(--on-amber)}
.st-past .t-stub{background:transparent;color:var(--ink-2)}
.st-past .t-stub .big{font-size:34px}
.t-more{position:absolute;top:6px;right:118px;width:40px;height:40px;border-radius:10px;font-size:20px;line-height:1;color:var(--ink-3);display:grid;place-items:center}
.empty{background:var(--card);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.foot{margin-top:32px;font-size:12.5px;color:var(--ink-3)}

/* trip */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.trip-head{padding-block:14px 16px}
.th-top{display:flex;justify-content:space-between;align-items:center;margin:0 -8px 10px}
.th-name{margin:0;font:800 34px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.th-sub{margin:6px 0 0;color:var(--ink-2)}
.th-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.count{display:inline-flex;align-items:baseline;gap:8px;padding:8px 12px;border-radius:10px;background:var(--tc,var(--sea));color:var(--on-acc)}
.count b{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.count span{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.count.st-now{background:var(--amber);color:var(--on-amber)}
.count.st-past{background:var(--card);color:var(--ink-2)}
.prog{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:3px}
.crew{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.crew .av{margin-right:-4px;box-shadow:0 0 0 2px var(--paper)}
.crew button{margin-left:10px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;gap:4px}
.tab{padding:12px 12px 11px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab small{font:500 11px var(--mono);color:var(--ink-3);margin-left:3px}
.panel{padding-block:16px 64px}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:76px;padding:9px 8px;border-radius:12px;background:var(--card);border:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;position:relative}
.dchip .dn{font:800 22px/1 var(--display)}
.dchip .dd{font-size:12px;color:var(--ink-2)}
.dchip .dp{font:500 10.5px var(--mono);color:var(--ink-3)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dchip.on .dd,.dchip.on .dp{color:var(--paper);opacity:.75}
.dchip.full .dp{color:var(--done)}
.dchip.on.full .dp{color:var(--paper)}
.dchip .tday{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 12px}
.day-head h2{margin:0;font-size:19px}
.day-head h2 span{font-weight:400;color:var(--ink-2);font-size:15px;margin-left:6px}
.day-head .mono{font-size:12.5px;color:var(--ink-3)}
.stay-band{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--sea-soft);margin-bottom:8px;width:100%}
.stay-band .k{font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sea);flex:none;width:72px}
.stay-band .v{min-width:0;flex:1}
.stay-band .v b{display:block;font-weight:600;overflow-wrap:anywhere}
.stay-band .v span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.stay-band.out{background:transparent;border:1px dashed var(--rule)}
.stay-band.none{background:transparent;border:1px dashed var(--rule);color:var(--ink-3);font-size:14px}

.timeline{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--rule);display:grid;place-items:center;color:transparent;margin-top:1px}
.check svg{width:16px;height:16px}
.stop.done .check{background:var(--done);border-color:var(--done);color:#fff}
.stop-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stop-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.time{font-size:13px;color:var(--ink-2);min-width:42px}
.stop-title{font-weight:600;overflow-wrap:anywhere}
.stop.done .stop-title{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.stop-note{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.extras{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2)}
.extras b{font-weight:500;color:var(--ink-3)}
.stop.move{background:transparent;box-shadow:none;border:1px solid var(--rule)}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route .arrow{color:var(--ink-3)}
.stop-links{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.adders{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{color:var(--ink-3);font-size:13.5px;margin:12px 2px 0}

.list{display:flex;flex-direction:column;gap:8px}
.sub-h{margin:22px 0 10px;font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.wish{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.wish .w-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wish .w-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wish .w-links{display:flex;gap:12px;flex-wrap:wrap}
.wish .w-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.planned{font:500 12px var(--mono);color:var(--done);background:var(--done-soft);padding:6px 8px;border-radius:8px}
.stay{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.stay .s-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stay b{font-size:16px;overflow-wrap:anywhere}
.stay .meta{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.warn{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(20px);opacity:.4}}}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-6px;background:var(--card);padding:10px 0 8px;z-index:1}
.sh-head h2{margin:0;font-size:18px;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:10px;font-size:24px;line-height:1;color:var(--ink-3);display:grid;place-items:center;flex:none}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 1px var(--sea)}
.help{font-size:12.5px;color:var(--ink-3);margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.err{color:var(--danger);font-size:13.5px;margin:0}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:4px}
.actions .r{display:flex;gap:10px;margin-left:auto}
.menu{display:flex;flex-direction:column;margin:0 -8px}
.menu button{padding:14px 10px;border-radius:10px;font-size:16px;text-align:left}
.menu button.danger{color:var(--danger)}
.menu .info{padding:0 10px 8px;font-size:13px;color:var(--ink-3)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{padding:12px 14px;border-radius:10px;border:1px solid var(--rule);text-align:left}
.pick button span{display:block;font-size:13px;color:var(--ink-3)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;background:var(--tc);border:3px solid var(--card);box-shadow:0 0 0 1px var(--rule)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-size:14px}
.tag button{width:26px;height:26px;border-radius:50%;color:var(--ink-3);display:grid;place-items:center;font-size:16px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.person span{flex:1;min-width:0;overflow-wrap:anywhere}
.person small{color:var(--ink-3)}
.sec{border-top:1px solid var(--rule);padding-top:14px}
.grip{flex:none;width:22px;align-self:stretch;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;margin:-4px -2px -4px -6px;border-radius:6px}
.grip svg,.gripi svg{width:10px;height:16px}
.gripi{flex:none;color:var(--ink-3);display:grid;place-items:center;width:16px}
.pool{margin:4px 0 16px;padding:12px;border-radius:14px;border:1.5px dashed var(--rule);transition:background .15s,border-color .15s}
.pool-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--ink-3)}
.pool-h b{color:var(--ink);font-size:14px}
.pool-list{display:flex;flex-wrap:wrap;gap:8px}
.pcard{display:flex;align-items:center;gap:6px;max-width:100%;padding:8px 12px 8px 6px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-size:14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pcard>span:last-child{min-width:0;display:flex;flex-direction:column}
.pcard .pt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}

const CONFIG = {

/* ---------- 小工具 ---------- */

const diff = (a, b) => Math.round((b - a) / 864e5);
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// 口令变成一串编号再存，数据库里看不到口令原文

const normCode = c => String(c || '').trim().toLowerCase().replace(/\s+/g, '');

const DEFAULT_KINDS = ['Sight', 'Food', 'Activity', 'Shopping', 'Other'];
const DEFAULT_MODES = ['Walk', 'Metro', 'Bus', 'Taxi', 'Drive', 'Train', 'High-speed rail', 'Flight', 'Ferry', 'Bike'];
const COLORS = ['sea', 'teal', 'forest', 'plum', 'coral', 'ink'];
const COLOR_NAMES = { sea: 'Sea blue', teal: 'Teal', forest: 'Forest green', plum: 'Plum', coral: 'Coral', ink: 'Ink grey' };

const google = q => 'https://www.google.com/search?q=' + encodeURIComponent(q);
const mapQ = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
function routeUrl(s) {
  const m = (s.mode || '').toLowerCase();

  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(s.from) + '&destination=' + encodeURIComponent(s.to) + '&travelmode=' + mode;

const ext = (href, label) => `<a class="linkish" href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;

function errText(e) { if (!e) return ''; if (typeof e === 'string') return e; return [e.code, e.message || e.msg].filter(Boolean).join(': ') || String(e); }

  const s = errText(e);

  if (/collection|COLLECTION|集合/.test(s)) return `Collection ${CONFIG.collection} was not found. Create it in the document database.`;

/* ---------- 数据库：本机试用模式 ---------- */
const LocalDB = {
  mode: 'local', KEY: 'tripplanner.db.v3', ok: true,
  all() { const v = LS.get(this.KEY, {}); return v && typeof v === 'object' ? v : {}; },
  put(all) { this.ok = LS.set(this.KEY, all); },
  async init() {},
  async get(id) { const d = this.all()[id]; return d ? clone(d) : null; },
  async set(id, doc) { const all = this.all(); all[id] = Object.assign(clone(doc), { _id: id }); this.put(all); },
  async patch(id, flat) { const all = this.all(); const d = all[id]; if (!d) throw new Error('DOC_NOT_FOUND'); for (const k in flat) setPath(d, k, flat[k]); this.put(all); },
  async remove(id) { const all = this.all(); delete all[id]; this.put(all); },
  async trips(sid) { return Object.values(this.all()).filter(d => d.kind === 'trip' && d.space === sid).map(clone); },

/* ---------- 数据库：腾讯云开发 ---------- */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('load failed')); document.head.appendChild(s); });
}
function check(r) { if (r && r.code && r.code !== 'SUCCESS' && r.code !== 0) { const e = new Error(r.message || String(r.code)); e.code = r.code; throw e; } return r; }
const one = r => (r ? (Array.isArray(r.data) ? (r.data[0] || null) : (r.data && typeof r.data === 'object' ? r.data : null)) : null);
const CloudDB = {
  mode: 'cloud', style: 'dot', ok: true,
  async init() {
    if (!(window.cloudbase && window.cloudbase.init)) {
      for (const v of ['latest', '3.x.x', '3.0.1']) {
        try { await loadScript(`https://static.cloudbase.net/cloudbase-js-sdk/${v}/cloudbase.full.js`); } catch (e) { continue; }
        if (window.cloudbase && window.cloudbase.init) break;
      }
      if (!(window.cloudbase && window.cloudbase.init)) { const e = new Error('SDK failed'); e.code = 'SDK_LOAD'; throw e; }
    }
    const opts = { env: String(CONFIG.env).trim(), region: CONFIG.region || 'ap-shanghai' };
    if (CONFIG.publishableKey) opts.accessKey = String(CONFIG.publishableKey).trim();
    this.app = window.cloudbase.init(opts);
    if (!CONFIG.publishableKey) {
      const auth = typeof this.app.auth === 'function' ? this.app.auth({ persistence: 'local' }) : this.app.auth;
      if (auth && auth.signInAnonymously) await auth.signInAnonymously();
      else if (auth && auth.anonymousAuthProvider) await auth.anonymousAuthProvider().signIn();
    }

    check(await this.col.limit(1).get());
    const sk = 'tripplanner.style.' + opts.env;
    this.style = LS.get(sk, null);
    if (!this.style) { this.style = await this.probe(); LS.set(sk, this.style); }
  },
  // 确认数据库能不能只改一个字段，避免一次保存把朋友刚写的内容盖掉
  async probe() {
    const ref = this.col.doc('__probe__');
    const test = async p => { check(await ref.set({ kind: 'probe', a: { x: 1, y: 1 } })); check(await ref.update(p)); const d = one(check(await ref.get())); return !!(d && d.a && d.a.x === 2 && d.a.y === 1); };
    try { if (await test({ 'a.x': 2 })) return 'dot'; if (await test({ a: { x: 2 } })) return 'nested'; return 'full'; }
    catch (e) { return 'dot'; }
  },
  async get(id) {
    try { return one(check(await this.col.doc(id).get())); }
    catch (e) { if (/NOT_?(EXIST|FOUND)/i.test(errText(e))) return null; throw e; }
  },
  async set(id, doc) { const d = clone(doc); delete d._id; check(await this.col.doc(id).set(d)); },
  async patch(id, flat) {

const CLOUD = !!String(CONFIG.env || '').trim();

/* ---------- 状态 ---------- */
// 本机记住的：你的名字、加入过的旅程（每个旅程一个口令）、外观
const PKEY = 'tripplanner.profile.v4';
let prof = Object.assign({ name: '', trips: [], seeded: false, accent: 'sea', theme: 'auto' }, LS.get(PKEY, {}) || {});
const saveProf = () => LS.set(PKEY, prof);
let site = { appName: CONFIG.appName };
let trips = [];
let view = { name: 'home' };
let pending = 0;
const hostTheme = document.documentElement.getAttribute('data-theme');
const SS = t => Object.assign({ kinds: DEFAULT_KINDS, modes: DEFAULT_MODES, fields: [] }, (t && t.settings) || {});
const tripIdOf = code => 't' + spaceId(code).slice(1);
const codeOf = id => (prof.trips.find(r => r.id === id) || {}).code || '';
function randomCode() {
  const L = 'abcdefghjkmnpqrstuvwxyz';
  let c = ''; for (let i = 0; i < 3; i++) c += L[Math.floor(Math.random() * L.length)];
  return c + String(Math.floor(1000 + Math.random() * 9000));
}
const appName = () => site.appName || CONFIG.appName || "Let's Go";
function applyLook() {
  const root = document.documentElement;

  root.style.setProperty('--sea-soft', `var(--acc-${prof.accent}-soft)`);

let selected = null;  // 点一下选中的卡片

/* ---------- 旅程状态（倒计时） ---------- */
function status(t) {

/* ---------- 保存 ---------- */
async function mut(t, flat, msg) {
  flat.updatedAt = Date.now(); flat.updatedBy = prof.name;
  for (const k in flat) setPath(t, k, flat[k]);
  render();
  pending++;
  try { await db.patch(t._id, flat); if (msg) toast(msg); }
  catch (e) { console.warn(e); toast('Not saved. ' + explain(e)); await reloadTrip(t._id); }
  finally { pending--; }
}
async function reloadTrip(id) {
  try {
    const d = await db.get(id);
    const i = trips.findIndex(t => t._id === id);
    if (!d) {
      if (i >= 0) trips.splice(i, 1);
      prof.trips = prof.trips.filter(r => r.id !== id); saveProf();
      if (view.id === id) { view = { name: 'home' }; toast('This trip was deleted'); }
    }
    else if (i >= 0) trips[i] = d; else trips.push(d);
    render();

}
async function loadTrips() {
  const docs = await Promise.all(prof.trips.map(r => db.get(r.id)));
  const gone = prof.trips.filter((r, i) => !docs[i]);
  if (gone.length) { prof.trips = prof.trips.filter((r, i) => docs[i]); saveProf(); }
  trips = docs.filter(Boolean);
  return gone.length;
}
async function refreshTrips() {
  if (!prof.name || pending) return;

  catch (e) { toast(explain(e)); }
}

/* ---------- 页面 ---------- */
function render() {
  const app = $('#app');
  document.title = appName();
  if (!prof.name) { app.innerHTML = renderJoin(); return; }
  if (view.name === 'trip' && tripOf(view.id)) app.innerHTML = renderTrip(tripOf(view.id));
  else { view = { name: 'home' }; app.innerHTML = renderHome(); }
  const on = $('.dchip.on');
  if (on) on.parentNode.scrollLeft = on.offsetLeft - 16;
}
function go(v) { view = v; selected = null; render(); window.scrollTo(0, 0); }

/* 进入页 */
function renderJoin() {
  return `<div class="login">
    <h1>${esc(appName())}</h1>
    <p class="lede">Plan trips day by day and tick things off as you go. No account needed.</p>

      <form id="f-join" novalidate>

        <div class="field"><label for="j-code">Code from a friend (optional)</label><input id="j-code" maxlength="40" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Have a code? Enter it to join that trip"></div>
        <p class="help">Every trip has its own code. No code? No problem, you can create your own trips inside.</p>
        <p class="err" id="j-err" hidden></p>

      </form>
    </div>
  </div>`;
}
function codeProblem(code) {
  const c = normCode(code);
  if (c.length < 6) return 'Codes need at least 6 characters, so nobody guesses yours.';
  if (/^(\d)\1+$|^123456|^password|^000000|^888888|^666666/.test(c)) return 'That code is too easy to guess. Add a word or a few letters.';
  return '';
}
async function joinTrip(code) {
  const id = tripIdOf(code);
  if (prof.trips.some(r => r.id === id)) { await reloadTrip(id); return id; }
  const d = await db.get(id);
  if (!d) { const e = new Error('NO_TRIP'); e.code = 'NO_TRIP'; throw e; }
  prof.trips.push({ id, code: normCode(code) }); saveProf();
  trips.push(d);
  return id;
}
async function createTrip(doc, code) {
  const id = tripIdOf(code);
  if (await db.get(id)) { const e = new Error('CODE_TAKEN'); e.code = 'CODE_TAKEN'; throw e; }
  doc._id = id;
  await db.set(id, doc);
  prof.trips.push({ id, code: normCode(code) }); saveProf();
  trips.push(doc);
  return id;
}
async function freeCode() {
  for (let i = 0; i < 6; i++) { const c = randomCode(); if (!(await db.get(tripIdOf(c)))) return c; }
  return randomCode() + randomCode().slice(-2);
}

/* 首页 */
function ticket(t) {
  const st = status(t), n = dayCount(t);

  const who = whoList(t);

}

      const who = [...new Set(val(el, 't-who').split(/[,，、;；\s]+/).map(x => x.trim()).filter(Boolean))];
      const err = $('#t-err', el), bad = m => { err.textContent = m; err.hidden = false; };
      if (!dest && !name) return bad('Add where you are going.');
      if (!start || !end) return bad('Pick the first and last day.');
      if (end < start) return bad('The last day comes before the first day. Check the dates.');
      if (dayCount({ start, end }) > 120) return bad('Trips can be up to 120 days long.');
      if (isNew) {
        const code = val(el, 't-code'), prob = codeProblem(code);
        if (prob) return bad(prob);
        const nt = { kind: 'trip', name, dest, start, end, color, who, stops: {}, stays: {}, settings: {}, createdAt: Date.now(), createdBy: prof.name, updatedAt: Date.now(), updatedBy: prof.name };
        try { const id = await createTrip(nt, code); closeSheet(); go({ name: 'trip', id, tab: 'days', day: null }); toast('Trip created. Its code is ' + normCode(code)); }
        catch (e2) { bad(e2.code === 'CODE_TAKEN' ? 'Another trip already uses that code. Try a different one.' : explain(e2)); }
      } else {
        const flat = { name, dest, start, end, color, who };
        const n = diff(parse(start), parse(end)) + 1; let moved = 0;
        stopsOf(t).forEach(s => { if (s.day != null && s.day > n - 1) { flat['stops.' + s.id + '.day'] = n - 1; moved++; } });
        staysOf(t).forEach(s => { const a = Math.min(s.n0, n - 1), b = Math.min(Math.max(s.n1, a + 1), n); if (a !== s.n0 || b !== s.n1) { flat['stays.' + s.id + '.n0'] = a; flat['stays.' + s.id + '.n1'] = b; } });
        closeSheet(); mut(t, flat, moved ? `Saved. ${plural(moved, 'stop')} moved to the last day` : 'Saved');
      }
    });
  });
}
async function duplicateTrip(t) {
  const c = clone(t);

  stopsOf(t).forEach(s => { const nid = uid(); stops[nid] = Object.assign(clone(s), { id: nid, done: false }); });
  staysOf(t).forEach(s => { const nid = uid(); stays[nid] = Object.assign(clone(s), { id: nid }); });
  c.stops = stops; c.stays = stays;

}

/* ---------- 点击事件 ---------- */
$('#app').addEventListener('click', e => {
  const b = e.target.closest('button,[data-open]'); if (!b) return;
  if (!prof.name) return;
  const ds = b.dataset;
  const t = view.name === 'trip' ? tripOf(view.id) : null;
  if (ds.more) { tripMenu(tripOf(ds.more)); return; }
  if (ds.open) { go({ name: 'trip', id: ds.open, tab: 'days', day: null }); reloadTrip(ds.open); return; }
  if (ds.tab) { view.tab = ds.tab; render(); return; }
  if (ds.day != null && b.classList.contains('dchip')) {
    if (selected && t && t.stops[selected]) { const id = selected; selected = null; view.day = +ds.day; placeStop(t, id, +ds.day); }
    else { view.day = +ds.day; render(); }
    return;
  }
  if (ds.done && t) { const s = t.stops[ds.done]; mut(t, { ['stops.' + ds.done + '.done']: !s.done }); return; }
  if ((ds.edit || ds.plan) && t) { stopForm(t, t.stops[ds.edit || ds.plan]); return; }
  if (ds.stay && t) { stayForm(t, t.stays[ds.stay]); return; }
  switch (ds.act) {
    case 'home': go({ name: 'home' }); refreshTrips(); break;
    case 'me': nameSheet(); break;
    case 'join': joinSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'share-code': if (t) shareCodeSheet(t); break;
    case 'new-trip': tripForm(null); break;
    case 'add-place': stopForm(t, null, { type: 'place', day: view.day }); break;
    case 'add-move': stopForm(t, null, { type: 'move', day: view.day }); break;
    case 'add-wish': stopForm(t, null, { type: 'place', day: null }); break;
    case 'add-wish-move': stopForm(t, null, { type: 'move', day: null }); break;
    case 'place-here': if (selected) { const id = selected; selected = null; placeStop(t, id, view.day); } break;
    case 'sel-unplan': if (selected) { const id = selected; selected = null; placeStop(t, id, null); } break;
    case 'sel-edit': if (selected) { const id = selected; selected = null; render(); stopForm(t, t.stops[id]); } break;
    case 'sel-cancel': selected = null; render(); break;
    case 'from-wish': pickFromWish(t); break;
    case 'add-stay': stayForm(t, null, ds.night != null ? +ds.night : view.day); break;
  }
});
$('#app').addEventListener('submit', async e => {
  if (e.target.id !== 'f-join') return;
  e.preventDefault();
  const el = e.target, err = $('#j-err', el), btn = $('#j-go', el);
  const bad = m => { err.textContent = m; err.hidden = false; btn.disabled = false; };
  const name = val(el, 'j-name'), code = val(el, 'j-code');
  if (!name) return bad('Add your name so friends can see who changed what.');
  btn.disabled = true;
  try {
    if (normCode(code)) {
      const id = await joinTrip(code);
      prof.name = name; prof.seeded = true; saveProf(); applyLook(); go({ name: 'trip', id, tab: 'days', day: null }); return;
    }
    prof.name = name; saveProf();
    if (!prof.seeded && !prof.trips.length) { await createTrip(exampleTrip(), await freeCode()); prof.seeded = true; saveProf(); }
    applyLook(); go({ name: 'home' });
  } catch (e2) { console.warn(e2); bad(e2.code === 'NO_TRIP' ? 'No trip has that code. Check the spelling, or leave the code empty and just start.' : explain(e2)); }
});

/* ---------- 拖拽 & 点选 ---------- */
let drag = null, raf = 0;
function clearMarks() { document.querySelectorAll('.drop-on,.ins-before,.ins-after').forEach(x => x.classList.remove('drop-on', 'ins-before', 'ins-after')); }
function hitTest(x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const pool = el.closest('[data-drop-pool]'); if (pool) return { kind: 'pool', el: pool };
  const dz = el.closest('[data-drop-day]'); if (!dz) return null;
  const h = { kind: 'day', el: dz, day: +dz.dataset.dropDay };
  if (dz.classList.contains('dayzone')) {
    const li = el.closest('li[data-sid]');
    if (li && li.dataset.sid !== drag.id) { const r = li.getBoundingClientRect(); h.li = li; if (y < r.top + r.height / 2) h.before = li.dataset.sid; else h.after = li.dataset.sid; }
  }
  return h;
}
function dragLoop() {
  if (!drag || !drag.on) return;
  const m = 70;
  if (drag.y < m) window.scrollBy(0, -14); else if (drag.y > innerHeight - m) window.scrollBy(0, 14);
  const row = document.querySelector('.days');
  if (row) { const b = row.getBoundingClientRect(); if (drag.y > b.top && drag.y < b.bottom) { if (drag.x < b.left + 44) row.scrollLeft -= 10; else if (drag.x > b.right - 44) row.scrollLeft += 10; } }
  raf = requestAnimationFrame(dragLoop);
}
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]');
  if (!g || view.name !== 'trip' || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  drag = { id: g.dataset.grip, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, src: g.closest('[data-sid]'), on: false };
  try { g.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.on) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 6) return;
    drag.on = true;
    const gh = drag.src.cloneNode(true);
    gh.classList.remove('sel', 'dragging'); gh.classList.add('ghost');
    gh.style.width = Math.min(drag.src.offsetWidth, 280) + 'px';
    document.body.appendChild(gh); drag.ghost = gh;
    drag.src.classList.add('dragging'); document.body.classList.add('is-dragging');
    dragLoop();
  }
  e.preventDefault();
  drag.ghost.style.left = drag.x + 'px'; drag.ghost.style.top = drag.y + 'px';
  clearMarks();
  const h = hitTest(drag.x, drag.y); drag.hit = h;
  if (h) { if (h.li) h.li.classList.add(h.before ? 'ins-before' : 'ins-after'); else h.el.classList.add('drop-on'); }
}, { passive: false });
function endDrag(commit) {
  const d = drag; drag = null; cancelAnimationFrame(raf); clearMarks(); document.body.classList.remove('is-dragging');
  if (!d) return;
  if (d.ghost) d.ghost.remove();
  if (d.src) d.src.classList.remove('dragging');
  const t = tripOf(view.id); if (!t || !t.stops[d.id] || !commit) return;
  if (!d.on) { selected = selected === d.id ? null : d.id; render(); return; }
  const h = d.hit; selected = null;
  if (!h) return render();
  if (h.kind === 'pool') { if (t.stops[d.id].day != null) placeStop(t, d.id, null); else render(); return; }
  placeStop(t, d.id, h.day, h.before, h.after);
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selected && !sheetEl) { selected = null; render(); return; }
  const g = e.target.closest && e.target.closest('.pcard[data-grip]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selected = selected === g.dataset.grip ? null : g.dataset.grip; render(); const again = document.querySelector(`.pcard[data-grip="${g.dataset.grip}"]`); if (again) again.focus(); }
});

// 定时拉取朋友的修改；正在填表、正在拖动或正在保存时先不刷新
async function tick() {
  if (!prof.name || sheetEl || pending || drag || document.hidden) return;
  if (view.name === 'trip') {
    const t = tripOf(view.id);
    try {
      const d = await db.get(view.id); if (pending || sheetEl || drag) return;
      if (!d || !t) return reloadTrip(view.id);
      if (d.updatedAt !== t.updatedAt) { Object.assign(t, d); render(); }
    } catch (e) {}
  } else refreshTrips();
}
setInterval(tick, CLOUD ? 8000 : 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
if (!CLOUD) window.addEventListener('storage', () => tick());

/* ---------- 启动 ---------- */
async function boot() {
  applyLook();
  try { await db.init(); }
  catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="login"><h1>${esc(appName())}</h1><div class="card"><h2 style="margin:0 0 8px;font-size:18px">Can't reach the database</h2><p style="color:var(--ink-2)">${esc(explain(e))}</p><p class="help mono">${esc(errText(e))}</p><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  try { const sd = await db.get('site'); if (sd && sd.appName) site.appName = sd.appName; } catch (e) {}
  if (prof.name) { try { await loadTrips(); } catch (e) { toast(explain(e)); } }
  render();
}
boot();
})();
</script>
